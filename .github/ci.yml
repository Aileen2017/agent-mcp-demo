name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@<FULL_COMMIT_SHA> # v4

      - name: Set up Python
        uses: actions/setup-python@<FULL_COMMIT_SHA> # v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q server.py

      - name: Verify server imports
        run: python -c "import server; print('Server import succeeded')"

      - name: Run tests
        run: python -m pytest