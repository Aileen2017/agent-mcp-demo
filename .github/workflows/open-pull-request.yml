name: Open pull request after successful CI

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: open-pull-request-${{ github.repository }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  open-pull-request:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch != github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      PASSED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Create one pull request for the tested branch head
        shell: bash
        run: |
          set -euo pipefail

          api_get() {
            curl --fail --silent --show-error \
              --retry 3 \
              --retry-all-errors \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}$1"
          }

          current_sha="$(api_get "/git/ref/heads/${HEAD_BRANCH}" | jq -er '.object.sha')"
          if [ "${current_sha}" != "${PASSED_SHA}" ]; then
            echo "Skipping: newer commits were pushed after this successful CI run."
            exit 0
          fi

          base_sha="$(api_get "/git/ref/heads/${BASE_BRANCH}" | jq -er '.object.sha')"
          ahead_by="$(api_get "/compare/${base_sha}...${current_sha}" | jq -er '.ahead_by')"
          if [ "${ahead_by}" -eq 0 ]; then
            echo "Skipping: the branch has no commits ahead of ${BASE_BRANCH}."
            exit 0
          fi

          owner="${GITHUB_REPOSITORY%/*}"
          existing_prs="$(
            curl --fail --silent --show-error \
              --retry 3 \
              --retry-all-errors \
              -G \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              --data-urlencode "state=open" \
              --data-urlencode "base=${BASE_BRANCH}" \
              --data-urlencode "head=${owner}:${HEAD_BRANCH}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls"
          )"

          if [ "$(jq 'length' <<<"${existing_prs}")" -gt 0 ]; then
            echo "An open pull request already exists for this branch."
            exit 0
          fi

          payload="$(
            jq -cn \
              --arg title "Automated PR: ${HEAD_BRANCH}" \
              --arg head "${HEAD_BRANCH}" \
              --arg base "${BASE_BRANCH}" \
              --arg body "Opened automatically after CI passed for commit \`${PASSED_SHA}\`." \
              '{title: $title, head: $head, base: $base, body: $body, maintainer_can_modify: true}'
          )"

          curl --fail --silent --show-error \
            --retry 3 \
            --retry-all-errors \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            --data-binary "${payload}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls" \
            | jq -r '"Created pull request: " + .html_url'
