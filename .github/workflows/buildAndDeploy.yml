name: Build and deploy

on:
  # dev: runs after the AgentDemo-Infra workflow finishes (the job's `if` keeps successes only).
  workflow_run:
    workflows: ["AgentDemo-Infra"] # must match `name:` in infra.yml exactly
    types: [completed]
  push:
    tags: ["v*"] # -> qa
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        options: [dev, qa]
        default: dev

permissions:
  contents: read

concurrency:
  group: build-and-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # After Infra, build only if its run succeeded.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      AWS_REGION: eu-west-2
      # The commit to build: the one Infra ran on, not whatever main points to now.
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      # Manual runs use the chosen environment; tag pushes go to qa; runs after Infra to dev.
      DEPLOY_ENV: ${{ inputs.environment || (github.ref_type == 'tag' && 'qa' || 'dev') }}
      # Account tier: dev and qa share the nonprod ECR repository; prod gets its own.
      # (Job-level env can't read other env values, so the DEPLOY_ENV expression is repeated.)
      DEPLOY_ENV2: ${{ (inputs.environment || (github.ref_type == 'tag' && 'qa' || 'dev')) == 'prod' && 'prod' || 'nonprod' }}
      ECR_REGISTRY: 730335559354.dkr.ecr.eu-west-2.amazonaws.com
    outputs:
      environment: ${{ env.DEPLOY_ENV }}
      environment2: ${{ env.DEPLOY_ENV2 }}
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Check out repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4.1.1
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Work out image name and tag
        id: image
        shell: bash
        run: |
          set -euo pipefail
          case "${DEPLOY_ENV}" in
            dev)
              tag="dev-${SOURCE_SHA}"
              ;;
            qa)
              # Git tag (or branch) name, made safe for Docker: only [A-Za-z0-9_.-],
              # must not start with '.' or '-', at most 128 characters.
              tag="$(printf '%s' "${GITHUB_REF_NAME}" | sed -E 's/[^A-Za-z0-9_.-]+/-/g; s/^[.-]+//' | cut -c1-128)"
              ;;
            *)
              echo "Unknown environment: ${DEPLOY_ENV}" >&2
              exit 1
              ;;
          esac
          if [ -z "${tag}" ]; then
            echo "Could not derive an image tag from ref '${GITHUB_REF_NAME}'." >&2
            exit 1
          fi
          image="${ECR_REGISTRY}/mcp-demo-${DEPLOY_ENV2}:${tag}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "Image: \`${image}\`" >> "${GITHUB_STEP_SUMMARY}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          # Keys of the mcp-demo-github-actions IAM user, which can only assume the role below.
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          role-to-assume: ${{ vars.AWS_ECR_PUSH_ROLE_ARN }}
          role-duration-seconds: 3600
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.image.outputs.image }}
          cache-from: type=gha,scope=${{ env.DEPLOY_ENV }}
          cache-to: type=gha,mode=max,scope=${{ env.DEPLOY_ENV }}
