name: AgentDemo-Infra-Destroy

on:
  # Tags containing destroy tear down qa if the tag also contains QA, otherwise dev.
  push:
    tags: ["*destroy*"]
  workflow_dispatch:

permissions:
  contents: read

# Same groups as the Infra workflow, so a destroy never overlaps a deploy of the same environment.
concurrency:
  group: infra-${{ github.ref_type == 'tag' && contains(github.ref_name, 'QA') && 'qa' || 'dev' }}
  cancel-in-progress: false

jobs:
  destroy:
    # Only runs for a tag containing destroy (pushed, or picked for a manual run).
    if: github.ref_type == 'tag' && contains(github.ref_name, 'destroy')
    runs-on: ubuntu-latest
    # Same required reviewers as a deploy, so a destroy also waits for approval.
    environment: infra-nonprod
    permissions:
      contents: read
    defaults:
      run:
        working-directory: infra/terraform
    env:
      AWS_REGION: eu-west-2
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4.1.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          role-duration-seconds: 3600
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false

      - name: Select environment
        env:
          IS_QA: ${{ github.ref_type == 'tag' && contains(github.ref_name, 'QA') }}
        run: |
          if [ "$IS_QA" = "true" ]; then
            ENVIRONMENT=qa
            TF_STATE_KEY=mcp-demo/qa/terraform.tfstate
          else
            ENVIRONMENT=dev
            TF_STATE_KEY=mcp-demo/dev/terraform.tfstate
          fi
          echo "ENVIRONMENT=$ENVIRONMENT" >> "$GITHUB_ENV"
          echo "TF_VAR_environment=$ENVIRONMENT" >> "$GITHUB_ENV"
          echo "TF_STATE_KEY=$TF_STATE_KEY" >> "$GITHUB_ENV"
          echo "Destroying environment: $ENVIRONMENT"

      - name: Terraform init
        run: terraform init

      - name: Terraform plan destroy
        run: terraform plan -destroy -out=destroy.tfplan

      - name: Terraform destroy
        run: terraform apply destroy.tfplan
