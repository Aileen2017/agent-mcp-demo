name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4.1.1

      - name: Set up Python
        uses: actions/setup-python@ad3497abcd142e169a10aac37abd5175c44f33c4 # v5.0.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q server.py

      - name: Verify server imports
        run: python -c "import server; print('Server import succeeded')"

      - name: Run tests
        run: python -m pytest