name: AgentDemo

on:
  pull_request:
    branches: [main]
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4.1.1

      - name: Set up Python
        uses: actions/setup-python@ad3497abcd142e169a10aac37abd5175c44f33c4 # v5.0.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q server.py

      - name: Verify server imports
        run: python -c "import server; print('Server import succeeded')"

      - name: Run tests
        run: python -m pytest

  build-and-push-image:
    needs: test
    # Pushes only for commits in this repo; pull requests (including forks) never get AWS access.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AWS_REGION: eu-west-2
      ENVIRONMENT: dev
      ECR_REPOSITORY: 730335559354.dkr.ecr.eu-west-2.amazonaws.com/mcp-demo-dev
    steps:
      - name: Check out repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4.1.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          # Keys of the mcp-demo-github-actions IAM user, which can only assume the role below.
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          role-to-assume: ${{ vars.AWS_ECR_PUSH_ROLE_ARN }}
          role-duration-seconds: 3600
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.ECR_REPOSITORY }}:${{ env.ENVIRONMENT }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

