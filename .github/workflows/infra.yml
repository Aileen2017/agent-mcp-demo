name: Infra

on:
  push:
    branches: [main, aws-infra]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/infra.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy, for example dev-<commit sha>"
        required: false
        default: "latest"

permissions:
  contents: read

# Never run two applies against the same state at once, and never cancel one halfway.
concurrency:
  group: infra-dev
  cancel-in-progress: false

jobs:
  infra:
    # Manual runs are allowed from any branch, so only deploy from these two.
    if: github.ref_name == 'main' || github.ref_name == 'aws-infra'
    runs-on: ubuntu-latest
    # Required reviewers on this environment (repo Settings -> Environments) pause the run
    # until a maintainer approves it.
    environment: infra-dev
    permissions:
      contents: read
    defaults:
      run:
        working-directory: infra/terraform
    env:
      AWS_REGION: eu-west-2
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_image_tag: ${{ inputs.image_tag || 'latest' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4.1.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          # Keys of the mcp-demo-github-actions IAM user, which can only assume the role below.
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          role-duration-seconds: 3600
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -out=tfplan.tfplan

      - name: Terraform apply
        run: terraform apply tfplan.tfplan
