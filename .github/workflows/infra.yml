name: AgentDemo-Infra

on:
  push:
    branches: [main, aws-infra]
    # Tags containing QA deploy the qa environment. Path filters don't apply to tag pushes.
    # Destroy tags are handled by infra-destroy.yml.
    tags: ["*QA*"]
    paths:
      - "infra/terraform/**"
      - "infra/infra-shared/**"
      - ".github/workflows/infra.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy, for example dev-<commit sha>"
        required: false
        default: "latest"

permissions:
  contents: read

# Never run two applies against the same state at once, and never cancel one halfway.
concurrency:
  group: infra-${{ github.ref_type == 'tag' && contains(github.ref_name, 'QA') && 'qa' || 'dev' }}
  cancel-in-progress: false

jobs:
  # The VPC and ECR repository that dev and qa share. Applied first, because the infra job
  # looks them up by name.
  infra-shared:
    # Same refs as the infra job below.
    if: >-
      !(github.ref_type == 'tag' && contains(github.ref_name, 'destroy')) && (
      github.ref_name == 'main' || github.ref_name == 'aws-infra' ||
      (github.ref_type == 'tag' && contains(github.ref_name, 'QA')))
    runs-on: ubuntu-latest
    # dev and qa runs hold different workflow-level groups but share this state, so
    # serialise the shared apply across both.
    concurrency:
      group: infra-shared-nonprod
      cancel-in-progress: false
    environment: infra-nonprod
    permissions:
      contents: read
    defaults:
      run:
        working-directory: infra/infra-shared
    env:
      AWS_REGION: eu-west-2
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4.1.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          role-duration-seconds: 3600
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        # dev and qa share the nonprod network and ECR repository.
        run: terraform plan -var-file=env/nonprod.tfvars -out=tfplan.tfplan

      - name: Terraform apply
        run: terraform apply tfplan.tfplan

  infra:
    needs: infra-shared
    # Manual runs are allowed from any ref, so only deploy from these branches or a QA tag,
    # and never from a destroy tag (a tag like v1-QA-destroy also matches *QA* above).
    if: >-
      !(github.ref_type == 'tag' && contains(github.ref_name, 'destroy')) && (
      github.ref_name == 'main' || github.ref_name == 'aws-infra' ||
      (github.ref_type == 'tag' && contains(github.ref_name, 'QA')))
    runs-on: ubuntu-latest
    # Required reviewers on this environment (repo Settings -> Environments) pause the run
    # until a maintainer approves it.
    environment: infra-nonprod
    permissions:
      contents: read
    defaults:
      run:
        working-directory: infra/terraform
    env:
      AWS_REGION: eu-west-2
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_image_tag: ${{ inputs.image_tag || 'latest' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4.1.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          # Keys of the mcp-demo-github-actions IAM user, which can only assume the role below.
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          role-duration-seconds: 3600
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false

      - name: Select environment
        env:
          IS_QA: ${{ github.ref_type == 'tag' && contains(github.ref_name, 'QA') }}
        run: |
          if [ "$IS_QA" = "true" ]; then
            ENVIRONMENT=qa
            # Each environment needs its own state, or a qa apply would replace the dev resources.
            TF_STATE_KEY=mcp-demo/qa/terraform.tfstate
          else
            ENVIRONMENT=dev
            TF_STATE_KEY=mcp-demo/dev/terraform.tfstate
          fi
          echo "ENVIRONMENT=$ENVIRONMENT" >> "$GITHUB_ENV"
          echo "TF_STATE_KEY=$TF_STATE_KEY" >> "$GITHUB_ENV"
          echo "Deploying environment: $ENVIRONMENT"

      - name: Terraform init
        run: terraform init -backend-config="key=$TF_STATE_KEY"

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -var-file="env/$ENVIRONMENT.tfvars" -out=tfplan.tfplan

      - name: Terraform apply
        run: terraform apply tfplan.tfplan
